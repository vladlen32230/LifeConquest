server {
    listen 80;
    server_name lifeconquest.ru;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name lifeconquest.ru;

    ssl_certificate /etc/letsencrypt/live/lifeconquest.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lifeconquest.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /front;
    index index.html;
    try_files $uri /index.html;

    location /api/v1/ {
        proxy_pass https://backend:8000/;

        proxy_http_version 1.1;  # Use HTTP/1.1 for WebSocket
        proxy_set_header Upgrade $http_upgrade;  # Handle WebSocket upgrade
        proxy_set_header Connection "upgrade";  # Handle WebSocket connection
        proxy_set_header Host $host;  # Forward the original Host header
        proxy_set_header X-Real-IP $remote_addr;  # Forward the real IP address
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Forward the X-Forwarded-For header
        proxy_set_header X-Forwarded-Proto $scheme;  # Forward the original protocol (http or https)
        proxy_read_timeout 86400;
    }

    location /jwt {
        proxy_pass https://backend:8000/api/v1/jwt;
    }
    
}

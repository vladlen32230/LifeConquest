apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: lifeconquest/lifeconquest-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRESQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-user.lifeconquest-db-cluster.credentials.postgresql.acid.zalan.do
                  key: username
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-user.lifeconquest-db-cluster.credentials.postgresql.acid.zalan.do
                  key: password
          envFrom:
            - secretRef:
                name: app-secrets
            - configMapRef:
                name: backend-config
          command: ["sh", "-c"]
          args: ["alembic upgrade head && gunicorn -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 main:app"]
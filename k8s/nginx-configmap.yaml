apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    server {
        listen 80;
        server_name lifeconquest.ru;

        root /front;
        index index.html;
        try_files $uri /index.html;

        location /api/v1/ {
            proxy_pass http://backend-service:8000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /jwt {
            proxy_pass http://backend-service:8000/api/v1/jwt;
        }
    }
